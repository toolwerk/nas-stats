[package]
name = "provider-qnap"
description = "QNAP QTS provider for NAS Stats: login over authLogin.cgi with a session and a hard stop after a rejected login, system values, network throughput, containers, volumes, disks with SMART and the backup jobs of Hybrid Backup Sync 3."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nas-model = { workspace = true }
nas-http = { workspace = true }
base64 = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
roxmltree = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
