[package]
name = "provider-truenas"
description = "TrueNAS provider for NAS Stats: JSON-RPC 2.0 over wss://<host>/api/current with the pinned certificate, login with an API key over SCRAM-SHA-512 (TrueNAS 26 and later) or API_KEY_PLAIN, and a hard stop after a rejected login."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nas-model = { workspace = true }
nas-http = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
ring = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "rt"] }
tokio-tungstenite = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tokio-rustls = { workspace = true }

[lints]
workspace = true
