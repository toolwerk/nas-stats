name: Apps

# Builds the iOS and macOS apps on the Xcode 27 runner. Runs only for a release
# (and by hand): macOS minutes count tenfold on the free plan.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: Build iOS and macOS apps
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - run: scripts/build-ffi.sh debug macosx
      - run: scripts/build-ffi.sh debug iphonesimulator
      - run: xcodegen generate
        working-directory: apps/NasStats
      # No signing on the runner; the project keeps automatic signing.
      - run: >
          xcodebuild build -project NasStats.xcodeproj -scheme NasStatsMac
          -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO
        working-directory: apps/NasStats
      - run: >
          xcodebuild build -project NasStats.xcodeproj -scheme NasStats
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
        working-directory: apps/NasStats
      # Swift test of the bindings (#12): calls the core, decodes every record.
      - run: >
          xcodebuild test -project NasStats.xcodeproj -scheme NasStatsMac
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
        working-directory: apps/NasStats
