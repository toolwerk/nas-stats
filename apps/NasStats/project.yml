name: NasStats
options:
  bundleIdPrefix: net.staude
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: de
  # Xcode checks for the XCFramework while planning, before any target runs,
  # so a fresh checkout needs it before the first build.
  postGenCommand: test -d Generated/StatsFFI.xcframework || ../../scripts/build-ffi.sh debug all
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "7N2W4T6UPV"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The pre-build script runs cargo and writes Generated/, outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  NasStats:
    type: application
    platform: iOS
    sources:
      - path: NasStats
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Shared
      # Generated by scripts/build-ffi.sh, not checked in.
      - path: Generated/stats_ffi.swift
        optional: true
    dependencies:
      # Builds the framework first; see aggregateTargets.
      - target: StatsFFI
      - framework: Generated/StatsFFI.xcframework
        embed: false
      - target: NasStatsWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.nasstats
        PRODUCT_NAME: NasStats
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Rust core is built for arm64 only.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        INFOPLIST_FILE: NasStats/Info-iOS.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: NasStats/NasStats.entitlements
      properties:
        # Shares the snapshot with the widget (Shared/AppGroup.swift).
        com.apple.security.application-groups:
          - group.net.staude.nasstats
        # Accounts live in the keychain under this group.
        keychain-access-groups:
          - $(AppIdentifierPrefix)net.staude.nasstats
    info:
      path: NasStats/Info-iOS.plist
      properties:
        CFBundleDisplayName: NAS Stats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Frank Neumann-Staude"
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "NAS Stats liest den Zustand Ihrer NAS im lokalen Netz."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
  NasStatsMac:
    type: application
    platform: macOS
    sources:
      - path: NasStats
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Shared
      - path: Generated/stats_ffi.swift
        optional: true
    dependencies:
      - target: StatsFFI
      - framework: Generated/StatsFFI.xcframework
        embed: false
      - target: NasStatsWidgetsMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.nasstats
        PRODUCT_NAME: NasStats
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: NasStats/Info-macOS.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
    entitlements:
      path: NasStats/NasStatsMac.entitlements
      properties:
        # The Mac app may go to the App Store later; network out is enough.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - 7N2W4T6UPV.net.staude.nasstats
        keychain-access-groups:
          - $(AppIdentifierPrefix)net.staude.nasstats
    info:
      path: NasStats/Info-macOS.plist
      properties:
        CFBundleDisplayName: NAS Stats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        # Menu bar app without a Dock icon.
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Frank Neumann-Staude"
        ITSAppUsesNonExemptEncryption: false
  NasStatsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "*.entitlements"
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.nasstats.widgets
        PRODUCT_NAME: NasStatsWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info-iOS.plist
        SKIP_INSTALL: YES
    entitlements:
      path: Widgets/NasStatsWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.staude.nasstats
    info:
      path: Widgets/Info-iOS.plist
      properties: &widgetInfo
        CFBundleDisplayName: NAS Stats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  NasStatsWidgetsMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
        excludes:
          - "*.entitlements"
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.nasstats.widgets
        PRODUCT_NAME: NasStatsWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info-macOS.plist
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    entitlements:
      path: Widgets/NasStatsWidgetsMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - 7N2W4T6UPV.net.staude.nasstats
    info:
      path: Widgets/Info-macOS.plist
      properties: *widgetInfo
  # Swift test of the bindings: calls the Rust core and decodes every
  # record. No host app, so it runs without signing on the runner.
  NasStatsMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # Accounts and store without UI, compiled into the test bundle; the
      # tests do not touch the keychain.
      - path: NasStats/Accounts
      - path: NasStats/Store
      # Detail screen (#18): its content model is tested, the view compiles along.
      - path: NasStats/Detail
      - path: Shared
      - path: Generated/stats_ffi.swift
        optional: true
    dependencies:
      - target: StatsFFI
      - framework: Generated/StatsFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.nasstats.tests
        GENERATE_INFOPLIST_FILE: YES
aggregateTargets:
  # Runs scripts/build-ffi.sh before either app target, as a target of its
  # own: a script phase inside the app target cannot produce the framework
  # the same target links.
  StatsFFI:
    settings:
      SUPPORTED_PLATFORMS: "macosx iphoneos iphonesimulator"
      SDKROOT: auto
    buildScripts:
      - name: Build stats-ffi
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then profile=release; else profile=debug; fi
          "$SRCROOT/../../scripts/build-ffi.sh" "$profile" "$PLATFORM_NAME"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/StatsFFI.xcframework
          - $(SRCROOT)/Generated/stats_ffi.swift
schemes:
  NasStats:
    build:
      targets:
        NasStats: all
    run:
      config: Debug
    archive:
      config: Release
  NasStatsMac:
    build:
      targets:
        NasStatsMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NasStatsMacTests
    archive:
      config: Release
